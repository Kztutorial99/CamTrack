plugins { id 'com.android.application' }

android {
    namespace 'com.kztutorial99.camtrack'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kztutorial99.camtrack'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }

    androidResources { noCompress 'tflite' }
}

// Optional drop-in slot: if a MediaPipe-compatible (metadata-packed) YOLO-n
// model is placed at app/src/main/assets/yolo_n.tflite it is used first.
// Nothing is downloaded for it: no public YOLO-n build ships the TFLite
// metadata the MediaPipe ObjectDetector requires.
def vehicleModels = [
    // int8 build: ~2-3x faster per frame than float32 on CPU, same recall class.
    'efficientdet_lite0.tflite': [
        'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite',
        3000000
    ],
    // Lite2 (448x448 input) detects smaller / further vehicles than Lite0.
    'efficientdet_lite2.tflite': [
        'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/1/efficientdet_lite2.tflite',
        7000000
    ]
]

tasks.register('downloadVehicleModel') {
    def assetsDir = file('src/main/assets')
    outputs.files(vehicleModels.keySet().collect { file("src/main/assets/$it") })
    outputs.upToDateWhen { false }
    doLast {
        assetsDir.mkdirs()
        vehicleModels.each { name, spec ->
            def modelFile = file("src/main/assets/$name")
            if (!modelFile.exists() || modelFile.length() < spec[1]) {
                println("Downloading $name vehicle detector...")
                new URL(spec[0]).withInputStream { input ->
                    modelFile.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('downloadVehicleModel') }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
    // on-device OCR used to read real licence plates (no network needed)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
